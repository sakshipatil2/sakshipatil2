# Generates the animated "snake eating contributions" SVGs used in README.md.
# Uses the well-known, actively maintained action: Platane/snk
# Docs: https://github.com/Platane/snk
#
# TODO: no changes needed for this to work — just commit this file at
#       .github/workflows/snake.yml in the sakshipatil2/sakshipatil2 repo.
#       It runs automatically on a schedule and on every push to main.

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"   # regenerate every 6 hours
  push:
    branches:
      - main                 # regenerate whenever you update this branch
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: sakshipatil2
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push generated SVGs to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
